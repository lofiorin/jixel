# Checks every push and pull request. Desktop app builds run on pushes to
# main and on demand (they take a while).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.44.6"

jobs:
  core:
    name: Rust core and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch libjxl
        run: |
          git submodule update --init --depth 1 core/crates/jixel-libjxl-sys/libjxl
          cd core/crates/jixel-libjxl-sys/libjxl
          git submodule update --init --depth 1 third_party/brotli third_party/highway third_party/skcms
      - uses: ilammy/setup-nasm@v1 # rav1e (AVIF encoder) needs nasm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            app/rust
      - name: Format
        run: |
          cargo fmt --manifest-path core/Cargo.toml --all --check
          cargo fmt --manifest-path app/rust/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path core/Cargo.toml --release --all-targets -- -D warnings
      - name: Test core
        run: cargo test --manifest-path core/Cargo.toml --release
      - name: Test bridge
        run: cargo test --manifest-path app/rust/Cargo.toml --release
        env:
          CARGO_TARGET_DIR: core/target

  app:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Translations are up to date
        run: |
          python3 tool/strings.py
          flutter gen-l10n
          dart format --line-length 120 lib/l10n
          git diff --exit-code -- lib/l10n
      - run: dart format --line-length 120 --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  desktop:
    name: Build ${{ matrix.os }}
    if: github.event_name != 'pull_request'
    needs: [core, app]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch libjxl
        shell: bash
        run: |
          git submodule update --init --depth 1 core/crates/jixel-libjxl-sys/libjxl
          cd core/crates/jixel-libjxl-sys/libjxl
          git submodule update --init --depth 1 third_party/brotli third_party/highway third_party/skcms
      - name: Linux dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake nasm ninja-build pkg-config libgtk-3-dev
      - uses: ilammy/setup-nasm@v1 # rav1e (AVIF encoder) needs nasm
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        working-directory: app
        run: flutter build ${{ matrix.target }} --release --verbose
      - uses: actions/upload-artifact@v7
        with:
          name: jixel-${{ matrix.target }}
          path: |
            app/build/macos/Build/Products/Release/*.app
            app/build/windows/x64/runner/Release/
            app/build/linux/x64/release/bundle/
          if-no-files-found: ignore
