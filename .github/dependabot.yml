version: 2
updates:
  - package-ecosystem: cargo
    directory: /core
    schedule: { interval: monthly }
  - package-ecosystem: pub
    directory: /app
    schedule: { interval: monthly }
    ignore:
      # Pinned by flutter_localizations in the Flutter SDK; it moves with Flutter.
      - dependency-name: intl
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
