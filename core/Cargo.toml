[workspace]
resolver = "2"
members = ["crates/jixel-libjxl-sys", "crates/jixel-core", "crates/jixel-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/lofiorin/jixel"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

# Codecs are painfully slow unoptimized; optimize dependencies even in debug.
[profile.dev.package."*"]
opt-level = 3
