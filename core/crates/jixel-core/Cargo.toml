[package]
name = "jixel-core"
description = "The Jixel image engine: JPEG XL encoding/decoding, conversions and web-delivery tools."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
jixel-libjxl-sys = { path = "../jixel-libjxl-sys" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "ico", "tga", "qoi", "pnm", "webp", "rayon"] }
webp = "0.3"
ravif = "0.13"
tract-onnx = { version = "0.23", optional = true }
ssimulacra2 = "0.5"
fast_image_resize = { version = "5", features = ["image"] }
rayon = "1"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"

[features]
default = ["background-removal"]
# On-device background removal / subject detection with the bundled U²-Netp
# model (~4.6 MB). Disable to build a smaller binary without it.
background-removal = ["dep:tract-onnx"]
